<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q8 Blog</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        article {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <button id="add-post">Add New Post</button>
    <button id="prepend-post">Prepend Featured Post</button>
    <button id="remove-last">Remove Last Post</button>
    <button id="add-tag">Add Tags</button>
    <button id="highlight-key">Highlight 'JS'</button>

    <div id="blog-list">
        <article>This is a standard JS post.</article>
        <article>This is a CSS styling post.</article>
        <article>Another post about HTML structure.</article>
    </div>

    <script src="q8_blog.js"></script>
</body>

</html>
