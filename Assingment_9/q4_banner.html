<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4 Banners</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #banner-container { height: 100px; position: relative; margin-bottom: 20px;}
        .banner { 
            width: 100%; height: 100px; 
            color: white; font-size: 24px; text-align: center; line-height: 100px;
            position: absolute; top: 0; left: 0;
        }
    </style>
</head>
<body>

    <div id="banner-container">
        <div class="banner" style="background:red;">Big Sale 1 - 50% OFF</div>
        <div class="banner" style="background:blue; display:none;">Big Sale 2 - Buy 1 Get 1</div>
        <div class="banner" style="background:green; display:none;">Big Sale 3 - Free Shipping</div>
    </div>

    <button id="hide-btn">Hide</button>
    <button id="show-btn">Show</button>
    <button id="slide-btn">Slide Toggle</button>
    <button id="fade-btn">Fade Toggle</button>

    <script src="q4_banner.js"></script>
</body>
</html>
