<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2: CSS Tooltips</title>
    <link rel="stylesheet" href="q2_style.css">
</head>
<body>
    <main class="tooltip-page">
        <h1>Hover over the items</h1>
        
        <div class="example-container">
            <span class="tooltip-trigger">
                Hover Me!
                <span class="tooltip-text">This is a CSS tooltip!</span>
            </span>

            <span class="tooltip-trigger icon">
                [i]
                <span class="tooltip-text">This is tooltip for an icon.</span>
            </span>

            <span class="tooltip-trigger">
                Me Too!
                <span class="tooltip-text">Fades in smoothly.</span>
            </span>
        </div>
    </main>
</body>
</html>
