<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 10: Mini UI Layout</title>
    <link rel="stylesheet" href="q10_style.css">
</head>
<body>
    <header class="site-header">
        <nav>
            <div class="logo">MySite</div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        <section class="content-card">
            <div class="card-image">
                <img src="https://via.placeholder.com/400x300/9b59b6/ffffff?text=Feature" alt="Feature Image">
            </div>
            <div class="card-form">
                <h2>Get In Touch</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your@email.com">
                    </div>
                    <button type="submit" class="btn">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Mini UI Layout. All rights reserved.</p>
    </footer>
</body>
</html>
