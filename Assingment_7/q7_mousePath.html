<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q7 Mouse Path</title>
    <style>
        #box {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <p>Coords: <span id="coords">0, 0</span></p>
    <div id="box"></div>
    <script src="q7_mousePath.js"></script>
</body>

</html>
