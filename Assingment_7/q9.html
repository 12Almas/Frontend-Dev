<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9: Outline and Focus</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>
    <main>
        <form action="#">
            <h2>Contact Us</h2>
            
            <label for="name">Name (Dotted Outline)</label>
            <input type="text" id="name" class="input-dotted" placeholder="Your Name">
            
            <label for="email">Email (Solid + Offset)</label>
            <input type="email" id="email" class="input-offset" placeholder="your.email@example.com">
            
            <label for="message">Message (Dashed Outline)</label>
            <textarea id="message" class="input-dashed" rows="5" placeholder="Your message..."></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
