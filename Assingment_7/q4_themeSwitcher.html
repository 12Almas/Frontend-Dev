<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q4 Theme Switcher</title>
    <style>
        .light {
            background-color: white;
            color: black;
        }

        .dark {
            background-color: #333;
            color: white;
        }

        .blue {
            background-color: #e0f7fa;
            color: #006064;
        }
    </style>
</head>

<body class="light" data-theme="light">
    <h1>Select Theme</h1>
    <button id="lightBtn">Light</button>
    <button id="darkBtn">Dark</button>
    <button id="blueBtn">Blue</button>
    <script src="q4_themeSwitcher.js"></script>
</body>

</html>
