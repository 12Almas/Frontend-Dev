<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q2 Character Counter</title>
    <style>
        .warning {
            color: orange;
        }

        .danger {
            color: red;
            border-color: red;
        }
    </style>
</head>

<body>
    <textarea id="textBox" rows="4" cols="50" placeholder="Type here..."></textarea>
    <p>Remaining: <span id="counter">100</span></p>
    <button id="resetBtn">Reset</button>
    <script src="q2_charCounter.js"></script>
</body>

</html>
