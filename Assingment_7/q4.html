<body>
    <header>
        <h1>Shadows & Depth</h1>
    </header>

    <main class="card-container">
        <article class="card">
            <h2>Subtle Shadow</h2>
            <p>This card has a light, subtle shadow for minimal depth.</p>
        </article>

        <article class="card">
            <h2>Deeper Shadow</h2>
            <p>This card has a more pronounced shadow, making it "float" more.</p>
        </article>

        <article class="card">
            <h2>Layered Shadow</h2>
            <p>This card uses multiple shadows for a more realistic, soft depth.</p>
        </article>
    </main>
