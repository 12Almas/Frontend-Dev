<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2: Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <main>
        <div class="box box-1">
            <p><strong>px & %</strong></p>
            <p>width: 300px<br>height: 25%</p>
        </div>
        
        <div class="box box-2">
            <p><strong>vh & em</strong></p>
            <p>width: 20em<br>height: 40vh</p>
        </div>
        
        <div class="box box-3">
            <p><strong>min/max & overflow</strong></p>
            <p>min-height: 150px<br>max-width: 250px</p>
            <p>This text will overflow. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam, quas.</p>
        </div>
    </main>
</body>
</html>
