<!DOCTYPE html>
<html>

<head>
    <title>HTML Entities</title>
</head>

<body>
    <p>
        The less-than sign is &lt;, the greater-than sign is &gt;, and the ampersand is &amp;. <br>
        The double quote is &quot;, and the single quote is &apos;. <br>
        The copyright symbol is &copy;, the trademark symbol is &trade;, and the registered trademark symbol is &reg;.
    </p>
</body>

</html>
