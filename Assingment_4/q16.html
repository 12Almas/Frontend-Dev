<!DOCTYPE html>
<html>

<head>
    <title>URI Encoding</title>
</head>

<body>
    <p>
        Original URL: <code>https://example.com/search?query=HTML & CSS</code>
    </p>
    <p>
        Encoded URL: <code>https://example.com/search?query=HTML%20%26%20CSS</code>
    </p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for "HTML & CSS"</a>
</body>

</html>
