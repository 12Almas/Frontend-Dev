<!DOCTYPE html>
<html>

<head>
    <title>Payment Form</title>
</head>

<body>
    <form action="#" method="post">
        <label for="cardholder_name">Cardholder Name:</label><br>
        <input type="text" id="cardholder_name" name="cardholder_name" required><br><br>

        <label for="card_number">Card Number:</label><br>
        <input type="text" id="card_number" name="card_number" required><br><br>

        <label for="expiry_date">Expiry Date (MM/YY):</label><br>
        <input type="text" id="expiry_date" name="expiry_date" required><br><br>

        <label for="cvv">CVV:</label><br>
        <input type="text" id="cvv" name="cvv" required><br><br>

        <input type="submit" value="Pay Now">
    </form>
</body>

</html>
