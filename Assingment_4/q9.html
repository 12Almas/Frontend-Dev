<!DOCTYPE html>
<html>

<head>
    <title>File Upload</title>
</head>

<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="file_upload">Upload Image:</label><br>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png"><br><br>

        <p>Only .jpg and .png files are allowed.</p>

        <input type="submit" value="Upload">
    </form>
</body>

</html>
