<!DOCTYPE html>
<html>

<head>
    <title>Form Security</title>
</head>

<body>
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Submit">
    </form>
    <p>
        Turning off autocomplete can improve security by preventing browsers from automatically storing sensitive data
        like usernames and passwords. This reduces the risk of credential theft on shared or public computers.
    </p>
</body>

</html>
